# Generated by tools/make_aidlc_workflow.py from AI-DLC's stage table (AI-DLC Workflows 2.11): edit the generator.
name: aidlc-on-archon
description: >-
  AWS AI-DLC's 33 stages (Initialization, Ideation, Inception, Construction, Operation) as one
  Archon workflow. Each stage is an agent node led by AI-DLC's persona for it, followed by an
  approval: approve, or reject with changes and the stage is redone. The scope input picks the
  stages, as AI-DLC's scopes do (poc, bugfix, express, refactor, security-patch, infra, classic, mvp, workshop, enterprise, feature). Run it from the team workspace
  root. Use when: you want AI-DLC's stages and gates without AI-DLC's engine.
  NOT for: one small change (use request-to-pr), or AI-DLC's own record format (use AI-DLC).

inputs:
  scope:
    default: express
    description: >-
      Which AI-DLC scope to run: poc (8), bugfix (9), express (10), refactor (10), security-patch (10), infra (13), classic (18), mvp (23), workshop (26), enterprise (33), feature (33).
      The number is the stages the scope executes in AI-DLC.

nodes:
  # ── 0 Initialization: no gates ───────────────────────────────────────
  - id: workspace-scaffold
    bash: |
      for d in ideation inception construction operation; do mkdir -p "$ARTIFACTS_DIR/record/$d"; done
      echo "record: $ARTIFACTS_DIR/record (ideation inception construction operation)"

  - id: workspace-detection
    depends_on: [workspace-scaffold]
    mutates_checkout: false
    prompt: |
      AI-DLC stage 0.2 Workspace Detection. Look at this workspace (read CLAUDE.md first): is there
      application code in it (greenfield = no code), which repos, how they are built and tested, and
      is there a CI/CD pipeline definition in any repo. Change nothing. Write
      $ARTIFACTS_DIR/record/workspace.md and return the facts.
    output_format:
      type: object
      properties:
        greenfield: { type: boolean }
        has_pipeline: { type: boolean }
        repos: { type: array, items: { type: string } }
        summary: { type: string }
      required: [greenfield, has_pipeline, repos, summary]
      additionalProperties: false

  - id: state-init
    depends_on: [workspace-detection]
    runtime: bun
    with:
      scope: "$INPUTS.scope"
      greenfield: "$workspace-detection.output.greenfield"
      pipeline: "$workspace-detection.output.has_pipeline"
    script: state-init
    output_format:
      type: object
      properties:
        scope: { type: string }
        intent_capture: { type: boolean }
        market_research: { type: boolean }
        feasibility: { type: boolean }
        scope_definition: { type: boolean }
        team_formation: { type: boolean }
        rough_mockups: { type: boolean }
        approval_handoff: { type: boolean }
        reverse_engineering: { type: boolean }
        practices_discovery: { type: boolean }
        requirements_analysis: { type: boolean }
        user_stories: { type: boolean }
        refined_mockups: { type: boolean }
        domain_design: { type: boolean }
        units_generation: { type: boolean }
        contract_design: { type: boolean }
        delivery_planning: { type: boolean }
        functional_design: { type: boolean }
        nfr_requirements: { type: boolean }
        nfr_design: { type: boolean }
        infrastructure_design: { type: boolean }
        code_generation: { type: boolean }
        build_and_test: { type: boolean }
        ci_pipeline: { type: boolean }
        deployment_pipeline: { type: boolean }
        environment_provisioning: { type: boolean }
        deployment_execution: { type: boolean }
        observability_setup: { type: boolean }
        incident_response: { type: boolean }
        performance_validation: { type: boolean }
        feedback_optimization: { type: boolean }
      required: [scope, intent_capture, market_research, feasibility, scope_definition, team_formation, rough_mockups, approval_handoff, reverse_engineering, practices_discovery, requirements_analysis, user_stories, refined_mockups, domain_design, units_generation, contract_design, delivery_planning, functional_design, nfr_requirements, nfr_design, infrastructure_design, code_generation, build_and_test, ci_pipeline, deployment_pipeline, environment_provisioning, deployment_execution, observability_setup, incident_response, performance_validation, feedback_optimization]
      additionalProperties: false

  # ── 1 Ideation ─────────────────────────────────────────────────────
  - id: intent-capture
    depends_on: [state-init]
    trigger_rule: none_failed_min_one_success
    when: "$state-init.output.intent_capture == true"
    loop_group:
      max_iterations: 3
      until_bash: 'decision=$intent-capture-gate.output.decision; [ "$decision" = "approve" ]'
      nodes:
        - id: intent-capture-work
          mutates_checkout: false
          prompt: |
            AI-DLC stage 1.1 Intent Capture & Framing (Ideation). You lead it as the team's product manager; weigh what a solutions architect would say.
            The request: $USER_MESSAGE
            The record so far is in $ARTIFACTS_DIR/record/: read what the earlier stages wrote. Follow CLAUDE.md.
            This stage's job: restate the request: the problem, who has it, what success looks like.
            Write $ARTIFACTS_DIR/record/ideation/intent-capture.md. Change no code.
            Put anything only a person can decide at the top, as numbered questions with lettered options.
            Changes asked for on your previous version, if any: $LOOP_PREV.intent-capture-gate.output.text
            Return a short summary for the person who approves this stage.
        - id: intent-capture-gate
          depends_on: [intent-capture-work]
          wait:
            form: approval
            attention: |
              1.1 Intent Capture & Framing: approve, or reject with the changes you want (the stage is redone).

              $intent-capture-work.output

